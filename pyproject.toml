[project]
name = "scdp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.5, <3.15"
dependencies = [
    "filelock>=4.0.9",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "tzdata>=2026.5",
]

[project.scripts]
scdp-extrair = "scdp_automation.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "ty>=0.0.82",
]

[tool.ruff.lint]
extend-select = ["TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
